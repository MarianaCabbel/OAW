<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Lector de noticias RSS — últimas noticias de tecnología y más"/>
<meta name="theme-color" content="#0f172a"/>
<title>Noticias</title>
<link rel="preconnect" href="https://static.vecteezy.com" crossorigin/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.6;min-height:100vh}
body.preload-news .news-list#newsList{visibility:hidden}
body.preload-news .news-skeleton{display:grid}
.news-skeleton{display:none}
.page{max-width:1200px;margin:0 auto;padding:1.5rem 1rem}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1rem;border-radius:.75rem;margin-bottom:1.5rem;font-size:.875rem;color:#94a3b8}
.settings-toggle{background:none;border:none;cursor:pointer;font-size:1.25rem;color:#94a3b8;padding:.25rem;border-radius:.375rem;transition:color .2s,background .2s}
.settings-toggle:hover{color:#e2e8f0;background:#334155}
h1{font-size:clamp(1.5rem,4vw,2.25rem);font-weight:700;font-style:italic;margin-bottom:1.25rem;background:#1e293b;;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
</style>
<link rel="stylesheet" href="templates/css/news.css"/>
</head>
<body class="preload-news">
<main class="page">
  <div class="topbar">
    <span>Fecha de hoy: {{TODAY}}</span>
    <button type="button" class="settings-toggle" id="openSettings" aria-label="Abrir ajustes de fuentes RSS">&#9881;</button>
  </div>
  <h1><i>Noticias Recientes</i></h1>
  <div class="search-box">
    <form method="GET" action="" class="search-form main-search-form">
      <input class="search-input" type="text" name="q" value="{{SEARCH_QUERY}}" placeholder="Buscar por titulo de noticia" aria-label="Buscar por titulo de noticia"/>
      <input type="hidden" name="sort" value="{{SORT_BY}}"/>
      <input type="hidden" name="source" value="{{SOURCE_FILTER}}"/>
      <input type="hidden" name="category" value="{{CATEGORY_FILTER}}"/>
      <div class="search-actions">
        <button type="submit">Buscar</button>
        <button type="button" id="openFilters">Filtros avanzados</button>
        <a href="{{REFRESH_URL}}">Refrescar</a>
      </div>
    </form>
  </div>
  {{STATUS_HTML}}
  
  <section class="news-list news-skeleton" id="newsSkeleton" aria-hidden="true" aria-label="Cargando noticias">
    <article class="news-card skeleton-card"><div class="skeleton-block image"></div><div class="news-content"><div class="skeleton-block title"></div><div class="skeleton-block meta"></div><div class="skeleton-block text"></div></div></article>
    <article class="news-card skeleton-card"><div class="skeleton-block image"></div><div class="news-content"><div class="skeleton-block title"></div><div class="skeleton-block meta"></div><div class="skeleton-block text"></div></div></article>
    <article class="news-card skeleton-card"><div class="skeleton-block image"></div><div class="news-content"><div class="skeleton-block title"></div><div class="skeleton-block meta"></div><div class="skeleton-block text"></div></div></article>
  </section>
  
  <section class="news-list" id="newsList">{{NEWS_CARDS_HTML}}</section>
  
  <div class="modal-backdrop {{FILTERS_MODAL_CLASS}}" id="filtersModal" role="dialog" aria-modal="true" aria-labelledby="filtersTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="filtersTitle">Filtros avanzados</h2>
        <button type="button" class="modal-close" id="closeFilters" aria-label="Cerrar filtros">&#10005;</button>
      </div>
      <form method="GET" class="modal-form">
        <input type="hidden" name="q" value="{{SEARCH_QUERY}}"/>
        <label for="sourceFilterSelect">Fuente</label>
        <select id="sourceFilterSelect" name="source" class="sort-select">{{FILTER_SOURCE_OPTIONS}}</select>
        <label for="sortBySelect">Orden</label>
        <select id="sortBySelect" name="sort" class="sort-select">
          <option value="published_at"{{SORT_DATE_SELECTED}}>Fecha</option>
          <option value="title"{{SORT_TITLE_SELECTED}}>Titulo</option>
          <option value="category"{{SORT_CATEGORY_SELECTED}}>Categoria</option>
        </select>
        <label for="categorySelect">Categoria</label>
        <select id="categorySelect" name="category" class="sort-select">{{FILTER_CATEGORY_OPTIONS}}</select>
        <button type="submit">Aplicar filtros</button>
      </form>
    </div>
  </div>
  <!-- Modal: Fuentes RSS -->
  <div class="modal-backdrop {{SETTINGS_MODAL_CLASS}}" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="feedsTitle">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="feedsTitle">Fuentes RSS</h2>
        <button type="button" class="modal-close" id="closeSettings" aria-label="Cerrar ajustes">&#10005;</button>
      </div>
      {{PANEL_MESSAGE_HTML}}
      <form method="POST" class="modal-form">
        <input type="hidden" name="feed_action" value="add"/>
        <input type="url" name="new_feed_url" placeholder="https://sitio.com/feed.xml" required/>
        <button type="submit">Agregar fuente</button>
      </form>
      <div class="feed-list">{{FEED_ITEMS_HTML}}</div>
    </div>
  </div>
</main>

<script src="scripts/js/news-list.js" defer></script>
</body>
</html>
